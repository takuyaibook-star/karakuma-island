<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'"><title>カラくまちゃんの畑・にんじん試作</title><link rel="stylesheet" href="style.css?v=14"></head><body><main class="farm-app"><div class="scene"><canvas id="farm" tabindex="0" aria-label="草原の畑。画面下半分のスワイプで歩く。下半分を短くタップすると、近くに表示された作業を実行します。"></canvas><div id="loading"><div><p id="loading-message" role="status">草原を準備しています…</p><progress id="loading-progress" max="10" value="0" aria-label="画像の読み込み進捗"></progress><p id="loading-count">0 / 10</p><p id="loading-help" hidden>通信状態を確認し、Safariなどの標準ブラウザでもお試しください。</p><button id="retry" hidden>もう一度読み込む</button></div></div></div><header><div class="place"><small>KARAKUMA ISLAND</small><h1>カラくまちゃんの畑</h1><span id="harvest-summary">収穫 0こ</span><span id="water-meter">水 3/3</span></div><button id="bag" class="bag" aria-label="アイテムボックス">鞄</button><button id="music" class="music" aria-label="BGMを止める" aria-pressed="true">♪</button><button id="reset" class="quiet">はじめから</button></header><div id="water-guide" hidden><span id="water-arrow">➜</span> 水くみ場で水をくもう</div><p id="tutorial" class="tutorial" role="status"></p><div id="equipment" aria-label="道具のショートカット"><button id="equip-hoe" aria-pressed="false"><img src="assets/item-hoe-v1.png" alt="">クワ<small id="hoe-uses"></small></button><button id="equip-watering_can" aria-pressed="false"><img src="assets/item-watering-can-v2.png" alt="">じょうろ<small id="can-empty" hidden>からっぽ</small></button><button id="equip-super_hoe" aria-pressed="false" hidden><img src="assets/item-super-hoe-v1.png" alt="">すごいクワ</button></div><p class="walk-hint">下半分をスワイプで歩く・タップで決定</p><section class="controls" aria-label="畑での作業"><p id="message" role="status" aria-live="polite">畑のそばまで歩いてみよう</p><div class="action-row"><button id="action" data-nearby-action hidden></button><span id="nearby"></span></div></section><div id="stick" role="group" aria-label="上下左右の移動スティック"><div class="stick-lines">＋</div><div id="knob"></div></div><details class="settings"><summary>試作設定</summary><label><input type="checkbox" id="colorful-preview"> 次の種をカラフルにする</label><label><input type="checkbox" id="sfx-enabled" checked> 効果音</label><button id="trial-tools">試作用の道具を補充</button><p>にんじんは水やり後5秒で芽。芽から2分で育ち中、5分で収穫。成熟時に地面が乾き、そのまま1時間経つと枯れます。種だけなら枯れません。</p></details><div id="inventory-overlay" hidden><section class="inventory-panel" role="dialog" aria-modal="true" aria-labelledby="box-title"><div class="inventory-header"><h2 id="box-title">アイテムボックス</h2><button id="box-close" aria-label="アイテムボックスを閉じる">×</button></div><p id="inventory-water"></p><div id="inventory-list"></div><p class="inventory-note">にんじんの種は試作中は使い放題です。</p></section></div></main><audio id="bgm" src="../../assets/karakuma-island-bgm.m4a" preload="none" loop playsinline></audio><script src="../../boot.js?v=5"></script><script type="module" src="view.mjs?v=14"></script></body></html>
