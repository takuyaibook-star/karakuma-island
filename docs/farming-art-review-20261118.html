<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>畑とカラフルスイカ・素材比較</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f2e8;color:#354c3b;font:16px/1.7 sans-serif}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:25px;margin:0}h2{font-size:21px;margin-top:30px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:0;padding:12px;background:#fffdf6;border:1px solid #d8dfca;border-radius:16px;text-align:center}img{width:100%;height:240px;object-fit:contain}figcaption{font-weight:bold}a{font-size:12px;color:#59754a}p{margin:8px 0 20px}footer{font-size:13px;margin-top:22px}@media(max-width:480px){main{padding:16px}.grid{gap:8px}figure{padding:8px}img{height:150px}figcaption{font-size:13px}}</style><main><h1>カラくまちゃんの畑｜素材比較</h1><p>2026.11.18　画像案・未組込</p><h2>開墾前 → 開墾済み</h2><p>開墾済みは草と石を除いた平らな地面。耕した土とは別の状態です。</p><div class="grid"><figure><img src="../experiments/farming/assets/land-uncleared-v1.png" alt="開墾前"><figcaption>land-uncleared　開墾前</figcaption><a href="../experiments/farming/assets/land-uncleared-v1.png">原画像</a></figure><figure><img src="../experiments/farming/assets/land-cleared-v1.png" alt="開墾済み・未耕作"><figcaption>land-cleared　開墾済み・未耕作</figcaption><a href="../experiments/farming/assets/land-cleared-v1.png">原画像</a></figure></div><h2>カラフルなスイカ｜10案</h2><p>水彩の温かさを保ち、色・縞・形を変更。つると葉は実の後ろから左右へ。</p><div class="grid"><figure><img src="../experiments/farming/assets/watermelon-study-01-v1.png" alt="緑＋差し色"><figcaption>01　緑＋差し色</figcaption><a href="../experiments/farming/assets/watermelon-study-01-v1.png">原画像</a></figure><figure><img src="../experiments/farming/assets/watermelon-study-02-v1.png" alt="たて縞・桃色アクセント"><figcaption>02　たて縞・桃色アクセント</figcaption><a href="../experiments/farming/assets/watermelon-study-02-v1.png">原画像</a></figure><figure><img src="../experiments/farming/assets/watermelon-study-03-v1.png" alt="空色とミント"><figcaption>03　空色とミント</figcaption><a href="../experiments/farming/assets/watermelon-study-03-v1.png">原画像</a></figure><figure><img src="../experiments/farming/assets/watermelon-study-04-v1.png" alt="大きな絵の具パッチ"><figcaption>04　大きな絵の具パッチ</figcaption><a href="../experiments/farming/assets/watermelon-study-04-v1.png">原画像</a></figure><figure><img src="../experiments/farming/assets/watermelon-study-05-v1.png" alt="二色のゆるい切り替え"><figcaption>05　二色のゆるい切り替え</figcaption><a href="../experiments/farming/assets/watermelon-study-05-v1.png">原画像</a></figure><figure><img src="../experiments/farming/assets/watermelon-study-06-v1.png" alt="かすれた筆しま"><figcaption>06　かすれた筆しま</figcaption><a href="../experiments/farming/assets/watermelon-study-06-v1.png">原画像</a></figure><figure><img src="../experiments/farming/assets/watermelon-study-07-v1.png" alt="白皮・若葉しま"><figcaption>07　白皮・若葉しま</figcaption><a href="../experiments/farming/assets/watermelon-study-07-v1.png">原画像</a></figure><figure><img src="../experiments/farming/assets/watermelon-study-08-v1.png" alt="桃色の皮・緑しま"><figcaption>08　桃色の皮・緑しま</figcaption><a href="../experiments/farming/assets/watermelon-study-08-v1.png">原画像</a></figure><figure><img src="../experiments/farming/assets/watermelon-study-09-v1.png" alt="太細三色しま"><figcaption>09　太細三色しま</figcaption><a href="../experiments/farming/assets/watermelon-study-09-v1.png">原画像</a></figure><figure><img src="../experiments/farming/assets/watermelon-study-10-v1.png" alt="淡いパレットの曲線"><figcaption>10　淡いパレットの曲線</figcaption><a href="../experiments/farming/assets/watermelon-study-10-v1.png">原画像</a></figure></div><footer>採用案は未決定。ゲーム・育成・保存データに変更なし。素材の位置合わせとゲーム上の接地確認は採用後に行います。</footer></main></html>
